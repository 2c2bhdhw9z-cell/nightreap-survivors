name: Build unsigned iOS IPA

# Manual-trigger only. Produces an UNSIGNED .ipa for sideloading with ESign / Feather.
# No Apple Developer account, no certificates, no secrets. ESign/Feather do the signing
# on-device with your own Distribution.p12 + Distribution.mobileprovision.
#
# Runs on a macOS runner because building a real device .ipa needs Xcode. This repo is
# private, so macOS minutes are metered (~10x Linux). Trigger it when you actually want a build.

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Xcode build configuration"
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/mobile
    env:
      # expo prebuild needs SOME bundle id / owner; these never leave the runner and
      # nothing here is signed, so they're just metadata for the generated Xcode project.
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Generate native iOS project (prebuild)
        run: bunx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: packages/mobile/ios
        run: pod install --repo-update

      - name: Resolve scheme and workspace
        id: xc
        working-directory: packages/mobile/ios
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME"       >> "$GITHUB_OUTPUT"
          echo "Using workspace=$WORKSPACE scheme=$SCHEME"

      - name: Build for device without signing
        working-directory: packages/mobile/ios
        run: |
          # A plain build (not "archive") always leaves a real .app in a known
          # build folder. Archiving with signing fully off can skip copying the
          # .app into the archive, which is why we build directly instead.
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration "${{ github.event.inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          echo "Searching for a built .app (excluding Pods/intermediate/nested bundles)..."
          # Portable (no mapfile): write matches to a file, then read the list.
          find "$RUNNER_TEMP" "$HOME/Library/Developer/Xcode/DerivedData" \
            -type d -name "*.app" 2>/dev/null \
            | grep -viE "/(Pods|Frameworks|PlugIns|Watch)/" \
            | grep -viE "\.app/.*\.app" > "$RUNNER_TEMP/apps.txt" || true
          echo "Candidates found:"
          cat "$RUNNER_TEMP/apps.txt" || true
          # Prefer an app whose name contains Nightreap; otherwise the first candidate.
          APP_PATH=$(grep -i "nightreap" "$RUNNER_TEMP/apps.txt" | head -n1)
          [ -z "$APP_PATH" ] && APP_PATH=$(head -n1 "$RUNNER_TEMP/apps.txt")
          if [ -z "$APP_PATH" ]; then
            echo "No .app anywhere. Diagnostic listing of the build output:"
            find "$RUNNER_TEMP/dd/Build" -maxdepth 4 2>/dev/null || true
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 5 -name "*.app" 2>/dev/null || true
            exit 1
          fi
          echo "Using app: $APP_PATH"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ( cd "$RUNNER_TEMP" && zip -qry nightreap-unsigned.ipa Payload )
          ls -lh "$RUNNER_TEMP/nightreap-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: nightreap-unsigned-ipa
          path: ${{ runner.temp }}/nightreap-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
